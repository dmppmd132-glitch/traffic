# Cloudflare Workers 設定（只放 API 代理；前端在 GitHub Pages）
name = "tra-timetable"
main = "src/worker.js"
compatibility_date = "2026-11-01"

[vars]
# 允許呼叫 API 的前端網域（GitHub Pages）
ALLOWED_ORIGIN = "https://dmppmd132-glitch.github.io"

# 以下兩個綁定目前已在 Cloudflare 網頁上設定好（變數名稱必須是 DB、TOKEN_KV）。
# 若改用 `wrangler deploy` 部署，請把這兩段保持啟用，否則會覆蓋掉網頁上的綁定。

# D1：公車站站時刻表快取（24 小時）。資料表請先執行 schema.sql（網頁 Console 已建立過）。
[[d1_databases]]
binding = "DB"
database_name = "tra-timetable"
database_id = "7a5a215a-2ae5-4d28-a061-ae783fabd533"

# KV：TDX token 跨機器共用，避免 429
[[kv_namespaces]]
binding = "TOKEN_KV"
id = "3bce7fb8fb63489bbc2ba96afbc36d61"

# 金鑰請勿寫在這裡，改用指令設定：
#   npx wrangler secret put TDX_ID
#   npx wrangler secret put TDX_SECRET

# 讓 Worker 自動跑在離 TDX（台灣）較近的機房，降低延遲
[placement]
mode = "smart"
